<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class = "img-container">
  <img src= "https://www.uni-ball.es/wp-content/uploads/2017/11/Fido-Dido.jpg"
    alt= "fido dido laying on one hand as thinking about something" > 
  </div>
  <br>
  <header>
    <h1>The Trivia Quest</h1>
  </header>
  
  <div class="about">
  Welcome to the age of knowledge. You can test your knowledge and be proud.
  <br> After your choice of answer, you can find out if the answer is correct.
  <br> Thank you for visiting and we hope to see you again soon.
  
<section class="categories-section">
  <h2>Please choose a category</h2>
    
<div class="categories"></div>
  </section>
  
  <p class= "questionBank"></p>

<div class="answer-section">

  <label for="userAnswer">Your Answer:</label>

  <input type="text"
    id="userAnswer"
    placeholder="Type your answer here"
    autocomplete="off">

<button type="button" class="submitAnswer" onclick="submitAnswer()">Submit Answer</button>
  
</div>

<div> 
<button class="btn-ans" onclick= "toggleShowAnswer()">Show Answer</button>
</div>    
 
<p class = "answer"> </p>

<br>
 
<div>
  <button class = "btn" onclick="getNextQuestion()">Next Question</button>
</div>

<div class="score">Score: <span id="score">0</span> </div>
  
<script src="script.js"></script>
</body>
